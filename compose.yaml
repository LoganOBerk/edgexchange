name: edgexchange
services:

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}
      POSTGRES_DB: ${DBNAME}
    ports:
      - "${DBPORT}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER} -d ${DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    build:
      context: ./cache
      dockerfile: Dockerfile
    container_name: cache
    restart: always
    ports:
      - "${CHPORT}:6379"
    command: "redis-server --user ${CHUSER} on >${CHPASSWORD} ~* +@all --save ''"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./application/backend/Dockerfile
    container_name: backend
    restart: on-failure
    environment:
      - DATABASE_SOURCE=${DATABASE_SOURCE}
      - CACHE_SOURCE=${CACHE_SOURCE}
    ports:
      - "${BEPORT}:8000"
    volumes:
      - ./application/backend:/backend
      - /backend/.venv
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: ./application/frontend/Dockerfile
    container_name: frontend
    ports:
      - "${FEPORT}:3000"
    volumes:
      - ./application/frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    restart: always


volumes:
  dbdata:

      