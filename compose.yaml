name: edgexchange

x-cache: &ch
  restart: always
  build: ./system/cache

x-database: &db
  restart: always
  build: ./system/database

services:
  livech:
    <<: *ch
    command: ["--save", ""]
    environment:
      - CHUSER=${LCUSER}
      - CHPASS=${LCPASS}

  sessionch:
    <<: *ch
    volumes: [sessiondata:/data]
    command: ["--appendonly", "yes"]
    environment:
      - CHUSER=${SCUSER}
      - CHPASS=${SCPASS}

  primarydb:
    <<: *db
    volumes: [primarydata:/data]
    environment:
      - DBNAME=${PDNAME}
      - DBUSER=${PDUSER}
      - DBPASS=${PDPASS}

  backend:
    restart: on-failure
    build: ./system/application/backend
    ports: ["${BEPORT}:8000"]
    environment: [PDSOURCE, LCSOURCE, SCSOURCE, ORIGINS]
    depends_on:
      primarydb: { condition: service_healthy }
      livech: { condition: service_healthy }
      sessionch: { condition: service_healthy }

  frontend:
    restart: always
    build: ./system/application/frontend
    volumes: 
      - ./system/application/frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    ports: ["${FEPORT}:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  primarydata:
  sessiondata: