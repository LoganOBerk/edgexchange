name: edgexchange

x-cache: &cache
  restart: always
  build: ./system/cache
  environment:
    CHUSER: ${CHUSER}
    CHPASSWORD: ${CHPASSWORD}

services:
  livecache:
    <<: *cache
    ports: ["${LCHPORT}:6379"]
    command: ["--save", ""]

  sessioncache:
    <<: *cache
    volumes:
      - sessiondata:/data
    ports: ["${SCHPORT}:6379"]
    command: ["--appendonly", "yes"]

  database:
    restart: always
    build: ./system/database
    volumes:
      - systemdata:/data
    ports: ["${DBPORT}:5432"]
    environment:
      DBUSER: ${DBUSER}
      DBPASSWORD: ${DBPASSWORD}
      DBNAME: ${DBNAME}

  backend:
    restart: on-failure
    build: ./system/application/backend
    ports: ["${BEPORT}:8000"]
    environment:
      DATABASE_SOURCE: ${DATABASE_SOURCE}
      LIVE_CACHE_SOURCE: ${LIVE_CACHE_SOURCE}
      SESSION_CACHE_SOURCE: ${SESSION_CACHE_SOURCE}
    depends_on:
      database: { condition: service_healthy }
      livecache: { condition: service_healthy }
      sessioncache: { condition: service_healthy }

  frontend:
    restart: always
    build: ./system/application/frontend
    volumes:
      - ./system/application/frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    ports: ["${FEPORT}:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  systemdata:
  sessiondata: